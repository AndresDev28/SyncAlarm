# SyncAlarm Gradle properties — bootstrap-android-scaffold, PR 3 (scaffold-app).
#
# Originally planned for PR 1 (scaffold-build) but deferred (see apply-progress
# Deviations #2). Reintroduced here because PR 3's Android modules require
# `android.useAndroidX=true` and AGP 8.7+ fails-fast if the flag is missing while
# AndroidX dependencies are on the classpath.

# --- AndroidX ---
# Required by AGP 8.7+ when any `androidx.*` artifact is on the classpath.
# Without this, `:app:checkDebugAarMetadata` fails-fast with a hard error.
android.useAndroidX=true

# --- Kotlin code style ---
# Project-wide default import ordering; matches the official Kotlin coding conventions.
kotlin.code.style=official

# --- JVM args ---
# Generous heap for KSP + Hilt + Compose Compiler (the latter is heavy on the
# first cold build; ~30s warm rebases don't need this much).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# --- Build performance ---
# Parallel project execution; independent modules (`:domain`, `:data`, `:app`)
# can compile side-by-side.
org.gradle.parallel=true
org.gradle.caching=true
