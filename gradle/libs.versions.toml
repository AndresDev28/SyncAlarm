# SyncAlarm version catalog — bootstrap-android-scaffold, PR 1 (scaffold-build).
#
# This file is the single source of truth for plugin + library versions. Per-module
# `build.gradle.kts` files reference entries via `libs.<section>.<alias>` (for plugins:
# `alias(libs.plugins.…)`, for libraries: `implementation(libs.<alias>)`).
#
# Version-coupling rules enforced here (see sdd-design §Version Triplet):
#   1. KSP MUST track Kotlin patch exactly (e.g. KSP 2.0.21-1.0.28 ↔ Kotlin 2.0.21).
#   2. Compose Compiler plugin version = Kotlin version (it's the same plugin id).
#   3. AGP 8.7+ requires JDK 17 (handled in module build scripts via toolchain).
#   4. Hilt 2.52 is the first stable Hilt release with first-class KSP on Kotlin 2.0+.

[versions]
# --- Build toolchain ---
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.52"

# --- Android SDK targets ---
minSdk = "26"
compileSdk = "35"
targetSdk = "35"

# --- JDK toolchain (declared here so per-module build scripts can read it) ---
jdk = "17"

# --- AndroidX UI stack (consumed in PR 3: scaffold-app) ---
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
hiltNavigationCompose = "1.2.0"

# --- Async / data (consumed in PR 3) ---
coroutines = "1.9.0"

# --- Test stack (consumed in PR 2: scaffold-domain) ---
junit5Bom = "5.11.0"
mockk = "1.13.13"
turbine = "1.2.0"
assertj = "3.26.3"

[libraries]
# --- AndroidX core / lifecycle (PR 3) ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.13.1" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# --- Compose stack (PR 3) ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Hilt (PR 3) ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# --- Coroutines (PR 3) ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# --- Test stack (PR 2) ---
junit5-bom = { module = "org.junit:junit-bom", version.ref = "junit5Bom" }
junit5-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit5-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit5-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit5-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
# --- Android Gradle Plugin (PR 3) ---
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

# --- Kotlin family (PR 2/3) ---
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# --- KSP — annotation processing (PR 3) ---
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# --- Hilt (PR 3) ---
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[bundles]
# --- Compose UI bundle (PR 3) ---
compose-ui = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]

# --- Lifecycle (PR 3) ---
lifecycle = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-lifecycle-runtime-compose",
]

# --- Coroutines (PR 3) ---
coroutines = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android",
]

# --- Unit test stack (PR 2) ---
unit-test = [
    "junit5-jupiter",
    "mockk",
    "turbine",
    "assertj-core",
    "kotlinx-coroutines-test",
]