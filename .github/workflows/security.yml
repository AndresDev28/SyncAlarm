name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    name: CodeQL (Kotlin/Java)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platforms & build-tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          # NOTE: do NOT add `category:` — it is a free-form string for
          # distinguishing multiple analyses, not a query-suite selector.
          # The default security suite covers Java + Kotlin.
          # build-mode: manual is required for Kotlin — build-mode: none is
          # unsupported for Kotlin (we provide the explicit build below).

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build for CodeQL analysis
        run: ./gradlew :app:assembleDebug
        # Required by build-mode: manual — explicit compile between init and analyze.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        # NOTE: do NOT add `category:` here either. The spec forbids it
        # on both init and analyze; the Security tab uses the default
        # category derived from the languages.

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip Trivy on PRs: the scan is noisy on first cut and the weekly
    # cron + push-to-main schedule is sufficient. PRs still get CodeQL.
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: "."
          severity: HIGH,CRITICAL
          exit-code: "0"  # Warning-only on first cut. Follow-up `tighten-trivy-gate` will flip to "1" after triage.
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
