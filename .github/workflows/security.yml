name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    name: CodeQL (Kotlin/Java)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platforms & build-tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # NOTE: do NOT add `category:` — it is a free-form string for
          # distinguishing multiple analyses, not a query-suite selector.
          # The default security suite covers Java + Kotlin.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build for CodeQL analysis
        run: ./gradlew :app:assembleDebug
        # Kotlin requires explicit build between init and analyze.
        # build-mode: none is unsupported for Kotlin.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
        # NOTE: `category:` here on the analyze step is a free-form label for
        # the Security tab; it is NOT the same as the invalid init input.

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: "."
          severity: HIGH,CRITICAL
          exit-code: "0"  # Warning-only on first cut. Follow-up `tighten-trivy-gate` will flip to "1" after triage.
          ignore-unfixed: true
          format: table
