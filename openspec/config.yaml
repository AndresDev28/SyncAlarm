# openspec/config.yaml
# Auto-generated by sdd-init. Hand-edited; safe to extend.

schema: spec-driven

# Concise project context (kept under 10 lines per convention).
context: |
  Project: SyncAlarm (Android native, Kotlin).
  Architecture: Clean Architecture + MVVM (Domain modules isolated from Android
  to enable TDD; :domain is pure Kotlin JVM module per bootstrap-android-scaffold).
  Background: WorkManager (calendar scan) + AlarmManager (exact alarms).
  Persistence: Room or DataStore (TBD by a follow-up sdd-design change).
  Integrations: Google Calendar API (OAuth2 PKCE), Jetpack Security/KeyStore.
  Testing: CONFIGURED — strict_tdd is true with JUnit 5 + MockK + Turbine +
  AssertJ on :domain (sanity tests pass via `./gradlew :domain:test`).
  :app and :data land in PR 3 of bootstrap-android-scaffold.
  Artifact store: engram + openspec (hybrid / "both").
  Repo: https://github.com/AndresDev28/SyncAlarm.git (inner SyncAlarm/ is the
  git root; the outer sync-alarm/ wrapper carries opencode.json and .atl/).

rules:
  proposal:
    - Include rollback plan for any change that touches AlarmManager or
      WorkManager scheduling semantics.
    - Cite PRD section (e.g. "PRD §4 RF-01") for each requirement.
  specs:
    - Use Given/When/Then for every scenario.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Each requirement MUST trace back to a PRD functional (RF-xx) or
      non-functional requirement.
  design:
    - Include sequence diagrams for the alarm-firing and conflict-resolution
      flows.
    - Document Clean Architecture module boundaries and dependency direction
      (Domain ← Data ← Presentation, never the reverse).
    - Justify every Android-specific dependency in terms of PRD §6 NFRs.
  tasks:
    - Group by phase, use hierarchical numbering (1, 1.1, 1.2, ...).
    - First task MUST be a Gradle/Android scaffold bootstrap so subsequent
      tasks have a buildable project to compile against.
    - Keep tasks completable in one session where reasonable.
  apply:
    guidelines:
      - Follow the Clean Architecture layering established in design.
      - Never import android.* from :domain or any pure-Kotlin module.
      - Mirror the PRD's Spanish domain vocabulary in code identifiers only
        when there is no clear English equivalent (alarm, calendar, rule,
        offset all have standard English terms).
    tdd: true
    tdd_command: "./gradlew test"
    test_command: "./gradlew test"
  verify:
    test_command: "./gradlew test"
    build_command: "./gradlew :app:assembleDebug"
    coverage_threshold: 0
  archive:
    - Warn before merging any delta that removes a SCHEDULE_EXACT_ALARM or
      READ_CALENDAR usage (these are the contract with the OS).

# Per-project testing capabilities (kept in sync with the separate
# sdd/sync-alarm/testing-capabilities Engram observation).
testing:
  strict_tdd: true
  detected: 2026-08-05
  runner:
    available: true
    command: "./gradlew test"
    framework: "junit5"
  layers:
    unit: { available: true, tool: "junit5 + mockk + turbine + assertj" }
    integration: { available: false, tool: "" }
    e2e: { available: false, tool: "" }
  coverage:
    available: false
    command: ""
  quality:
    linter: { available: false, command: "" }
    type_checker: { available: false, command: "" }
    formatter: { available: false, command: "" }
  rationale: |
    :domain is a pure-Kotlin JVM module wired with JUnit 5 (BOM 5.11.0) +
    MockK 1.13.13 + Turbine 1.2.0 + AssertJ 3.26.3 + kotlinx-coroutines-test
    1.9.0. Sanity tests (`JupiterSanityTest`, `MockKSanityTest`,
    `TurbineSanityTest`, `AssertJSanityTest`) all pass via `./gradlew
    :domain:test`; module has zero Android dependencies per spec
    module-boundaries. :app + :data land in PR 3 of bootstrap-android-scaffold
    (the runner command will keep working as more modules wire in). Coverage
    tooling (JaCoCo) and Compose UI tests wire in a follow-up change.